skills:
  external_dirs:
  - __WSL_WORKSPACE__/skills-active
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 10
  guard_agent_created: false
  creation_nudge_interval: 15
cron:
  wrap_response: true
  max_parallel_jobs: null
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
plugins:
  enabled:
  - quotes-batch
  - christnews-trigger
  - fusion-frontends
  - image_gen/comfyui-bridge
  - __PRIVATE_TOKEN_02__-parity
  disabled: []
delegation:
  model: ''
  provider: ''
  base_url: ''
  inherit_mcp_toolsets: true
  max_iterations: 50
  child_timeout_seconds: 600
  reasoning_effort: ''
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  subagent_auto_approve: false
mcp_servers_disabled:
  wordpress:
    command: /home/__LINUX_USER__/.hermes/hermes-agent/venv/bin/python
    args:
    - __WSL_WORKSPACE__/.mcp-servers/wordpress/server.py
    env:
      WORDPRESS_SITE_BASE: https://example.com
      WORDPRESS_TOKEN_URL: https://example.com/wp-json/api/v1/token
      WORDPRESS_TOKEN_VALIDATE_URL: https://example.com/wp-json/api/v1/token-validate
      WORDPRESS_POSTS_URL: https://example.com/wp-json/wp/v2/posts
  local-rag:
    command: /home/__LINUX_USER__/.local/bin/node
    args:
    - __GLOBAL_NPM__/mcp-local-rag/dist/index.js
    env:
      BASE_DIR: __WSL_WORKSPACE__
      DB_PATH: __WSL_WORKSPACE__/.rag/db
      CACHE_DIR: __WSL_WORKSPACE__/.rag/cache
