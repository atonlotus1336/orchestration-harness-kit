version: "2026-07-05"
schema:
  required_fields:
    - id
    - class
    - config_path
    - owner
    - probe_cmd
    - cadence
    - slack
    - secret_fields
    - privacy_class
    - break_recipe
    - expected_red
  optional_fields:
    - install_stage
    - verify_cmd
    - state
    - notes
    - freshness_after
    - freshness_grace
    - export_target_path
    # Q7 ack_until amendment (PLAN.md 2026-07-07, section 7C H5): external marks a
    # surface whose availability depends on an outside service (VPS, n8n, cloud model
    # provider). Only external surfaces may carry ack_until/ack_by/ack_reason; setting
    # an ack MUST also append a PHASE-LEDGER row. Expired acks revert to RED.
    - external
    - ack_until
    - ack_by
    - ack_reason
    # M14 severity mechanism: severity: degrade marks a NON-CRITICAL surface (image/video
    # gen). Probe/expiry failures report DEGRADED (visible, counted) without flipping the
    # overall gate; RED stays reserved for core parity. Only the literal value "degrade"
    # is schema-legal.
    - severity
  enums:
    class:
      - profile
      - mcp
      - memory
      - eval
      - doc
      - kit-component
    privacy_class:
      - shareable
      - slot
      - local-only
    state:
      - active
      - quarantined
      - rotted
defaults:
  slack: "P1D"
  freshness_grace: "P7D"
discovery:
  profile_roots:
    - "__WINDOWS_WORKSPACE__/hermes-agent-self-evolution/profiles"
  mcp_roots:
    - "__WINDOWS_WORKSPACE__/.mcp-servers"
    - "__WINDOWS_WORKSPACE__/.codex/mcp-servers"
  mcp_exclude:
    - "_shared"
  scope_note: "Q8 auto-discovery/quarantine covers profile + MCP roots only, because those are the auto-spawning surface classes where unregistered drift is a real risk. doc/eval/memory/kit/plugin surfaces are manually curated and intentionally excluded from directory discovery to avoid false quarantines (e.g. every .md/.json under the vault)."
